[build]
  command = "npm run build"
  publish = ".next"

# Netlify's secret scanner flags its OWN build output: Next.js bundles the
# env vars Netlify injects at build time into .next server chunks/cache, and
# the scanner then reports those generated artifacts as "secrets". The repo
# commits are clean (no real secret values committed). Disable only the scan;
# the env vars remain properly encrypted in Netlify's environment store.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
